services:
  - type: web
    name: flowverge
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/flowverge.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
